# Warm-instance command module: the M3 execution model, previewed.
# A wasip1 reactor — initializes once, then commands are function calls.
[package]
name = "hot-demo"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
