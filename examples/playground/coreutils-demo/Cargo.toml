# Demo multicall binary: all wasip1-portable uutils coreutils in one module.
# Standalone package (own [workspace]) so the main nobox workspace stays clean.
[package]
name = "coreutils-demo"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
regex = "1"
uu_arch = "0.9"
uu_b2sum = "0.9"
uu_base32 = "0.9"
uu_base64 = "0.9"
uu_basename = "0.9"
uu_basenc = "0.9"
uu_cat = "0.9"
uu_checksum_common = "0.9"
uu_cksum = "0.9"
uu_comm = "0.9"
uu_cp = "0.9"
uu_csplit = "0.9"
uu_cut = "0.9"
uu_date = "0.9"
uu_dd = "0.9"
uu_dir = "0.9"
uu_dircolors = "0.9"
uu_dirname = "0.9"
uu_echo = "0.9"
uu_expand = "0.9"
uu_factor = "0.9"
uu_false = "0.9"
uu_fmt = "0.9"
uu_fold = "0.9"
uu_head = "0.9"
uu_join = "0.9"
uu_link = "0.9"
uu_ln = "0.9"
uu_ls = "0.9"
uu_md5sum = "0.9"
uu_mkdir = "0.9"
uu_mktemp = "0.9"
uu_mv = "0.9"
uu_nl = "0.9"
uu_nproc = "0.9"
uu_numfmt = "0.9"
uu_od = "0.9"
uu_paste = "0.9"
uu_pathchk = "0.9"
uu_pr = "0.9"
uu_printenv = "0.9"
uu_printf = "0.9"
uu_ptx = "0.9"
uu_pwd = "0.9"
uu_readlink = "0.9"
uu_realpath = "0.9"
uu_rm = "0.9"
uu_rmdir = "0.9"
uu_seq = "0.9"
uu_sha1sum = "0.9"
uu_sha224sum = "0.9"
uu_sha256sum = "0.9"
uu_sha384sum = "0.9"
uu_sha512sum = "0.9"
uu_shred = "0.9"
uu_shuf = "0.9"
uu_sleep = "0.9"
uu_sort = "0.9"
uu_split = "0.9"
uu_sum = "0.9"
uu_tail = "0.9"
uu_tee = "0.9"
uu_touch = "0.9"
uu_tr = "0.9"
uu_true = "0.9"
uu_truncate = "0.9"
uu_tsort = "0.9"
uu_uname = "0.9"
uu_unexpand = "0.9"
uu_uniq = "0.9"
uu_unlink = "0.9"
uu_vdir = "0.9"
uu_wc = "0.9"
uu_yes = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
