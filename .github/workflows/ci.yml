name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Invariant #4 / D11: gzip size budget for the default-features engine.
  SIZE_BUDGET_BYTES: 3145728

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace
      - name: SQLite store (standalone, native-only crate)
        run: cargo test --manifest-path crates/boxsh-store-sqlite/Cargo.toml

  test-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/boxsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:types

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install wasmtime (test runner only, not a shipped dependency)
        run: |
          curl -sSf https://wasmtime.dev/install.sh | bash
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"
      - name: Unit tests on wasm32-wasip1 (invariant #10)
        run: cargo test --workspace --target wasm32-wasip1
      - name: Build engine artifact
        run: cargo build --release --target wasm32-wasip1 -p boxsh-abi --features host-commands
      - name: Loader smoke test through the real artifact
        working-directory: packages/boxsh
        run: |
          npm ci
          npm run build
          node test/smoke.mjs
      - name: IndexedDB backend against the real wasm filesystem
        working-directory: packages/boxsh
        run: node test/idb.mjs

  # The Node suite exercises the replication scheduler against fake-indexeddb.
  # This job runs the real IndexedDB and OPFS storage calls in Chromium —
  # persistence across a page reload, and cross-tab Web Lock contention.
  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the filesystem wasm module
        run: cargo build --release --target wasm32-wasip1 -p boxsh-abi --features host-commands
      - name: Stage engine/fs.wasm
        # The browser backends need only the filesystem module. The command
        # modules come from demo crates this job deliberately does not build,
        # and scripts/build-engine.mjs insists on all three — so copy the one.
        run: |
          mkdir -p packages/boxsh/engine
          cp target/wasm32-wasip1/release/boxsh_abi.wasm packages/boxsh/engine/fs.wasm
      - name: Build the package
        working-directory: packages/boxsh
        run: |
          npm ci
          npm run build
      - name: Install Chromium
        working-directory: packages/boxsh
        run: npx playwright install chromium --with-deps
      - name: IndexedDB and OPFS backends in a real browser
        working-directory: packages/boxsh
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: packages/boxsh/test-results/
          retention-days: 7

  size-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --target wasm32-wasip1 -p boxsh-abi --features host-commands
      - name: Check gzip size against budget
        run: |
          gzip -9 -c target/wasm32-wasip1/release/boxsh_abi.wasm > boxsh_abi.wasm.gz
          size=$(stat -c%s boxsh_abi.wasm.gz)
          echo "gzip size: $size bytes (budget: $SIZE_BUDGET_BYTES)"
          test "$size" -le "$SIZE_BUDGET_BYTES"
