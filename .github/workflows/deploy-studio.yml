name: deploy-studio

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-studio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-wasip1
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Build boxsh package and engine
        working-directory: packages/boxsh
        run: |
          npm ci
          npm run build
          npm run build:engine
      - name: Build studio
        working-directory: studio
        env:
          PUBLIC_AXIOM_TOKEN: ${{ secrets.PUBLIC_AXIOM_TOKEN }}
          PUBLIC_AXIOM_DATASET: ${{ secrets.PUBLIC_AXIOM_DATASET }}
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: studio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name boxsh-studio
